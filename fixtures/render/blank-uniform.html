<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chart screenshot</title>
    <!-- Deliberately content-free: the recorded extraction answer for this fixture is BLANK, so the
         frame must carry no text, digit, chart artefact or structure a reader could interpret.
         Only the tonal patch below varies the fill, and it does so imperceptibly on purpose. -->
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      :root {
        color-scheme: light;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #f4f4f2;
      }

      .frame {
        position: relative;
        width: 100%;
        height: 100%;
        background-color: #f4f4f2;
      }

      .patch {
        position: absolute;
        inset-block-end: 0;
        inset-inline-end: 0;
        width: 12%;
        height: 10%;
        background-color: #f5f5f3;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="patch"></div>
    </div>
  </body>
</html>
